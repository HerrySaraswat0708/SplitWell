services:
  - type: web
    name: splitwell
    env: node
    region: singapore
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false           # paste your Neon/Supabase Postgres connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://splitwell.onrender.com   # Render replaces this with real URL
      - key: RESEND_API_KEY
        sync: false           # Render blocks outbound SMTP on the free tier — paste your Resend API key here instead
