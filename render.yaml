services:
  - type: web
    name: splitwell
    env: node
    region: singapore
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false           # paste your Neon/Supabase Postgres connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://splitwell.onrender.com   # Render replaces this with real URL
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: saraswatherry@gmail.com
      - key: SMTP_PASS
        sync: false           # you will paste the app password in Render dashboard
      - key: SMTP_FROM
        value: "Splitwell <saraswatherry+noreply@gmail.com>"
