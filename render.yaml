services:
  - type: web
    name: splitwise
    env: node
    region: singapore
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://splitwise.onrender.com   # Render replaces this with real URL
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: saraswatherry@gmail.com
      - key: SMTP_PASS
        sync: false           # you will paste the app password in Render dashboard
      - key: SMTP_FROM
        value: "SplitWise <saraswatherry@gmail.com>"
    disk:
      name: splitwise-data
      mountPath: /data
      sizeGB: 1
